<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E9B53">
<link rel="icon" href="logo.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>YP4T Connect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Young Professionals for Tinubu — join, get your membership card, find your ward team and join the door-to-door campaign.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a campaign field app — live tile map of Nigeria as home, sticky tab bar, one column on phones */
:root{
  --paper:#F5F7F2; --card:#FFFFFF; --ink:#1B2140; --muted:#5B6377; --line:#DCE2D8;
  --green:#2E9B53; --green-ink:#FFFFFF; --red:#DF3F3B; --sky:#45B5DF; --tile0:#E4EAE0; --soft:#EDF3EA;
  --warn:#B7791F; --warn-bg:#FFF6E3;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1320; --card:#161C2B; --ink:#E8ECF4; --muted:#9AA3B6; --line:#283146;
  --green:#3DB466; --green-ink:#08130C; --red:#F0605B; --sky:#5CC4EA; --tile0:#1D2536; --soft:#18223A;
  --warn:#E7B04F; --warn-bg:#2A2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1320; --card:#161C2B; --ink:#E8ECF4; --muted:#9AA3B6; --line:#283146;
  --green:#3DB466; --green-ink:#08130C; --red:#F0605B; --sky:#5CC4EA; --tile0:#1D2536; --soft:#18223A;
  --warn:#E7B04F; --warn-bg:#2A2414; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
h2{font-size:30px}h3{font-size:22px}
p{margin:0}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--green);color:var(--green-ink);text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:7px 14px;min-height:36px;font-size:14px;white-space:nowrap}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink)}
.pill.g{background:color-mix(in oklab,var(--green) 18%,transparent);color:var(--green)}
.pill.r{background:color-mix(in oklab,var(--red) 16%,transparent);color:var(--red)}
.pill.w{background:var(--warn-bg);color:var(--warn)}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=datetime-local],select,textarea{width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);min-height:44px}
textarea{resize:vertical;min-height:70px}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:500}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--green);flex:none}
.err{color:var(--red);font-size:14px;font-weight:600}
.demo-bar{background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:600;padding-block:7px;text-align:center}

/* Header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
.logo-plate{background:#fff;border-radius:8px;padding:3px 6px;display:flex;align-items:center}
.logo-plate img{height:38px;width:auto;display:block}
.brand{font-family:var(--display);font-size:22px;font-weight:800;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.top .me{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--soft);flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted);overflow:hidden}
.avatar.lg{width:64px;height:64px;font-size:22px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--green)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;margin-left:4px}
main{padding-block:20px 60px}

/* Landing */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding-block:28px 10px}
.hero h1{font-size:clamp(44px,8vw,84px);font-weight:900}
.hero h1 .r{color:var(--red)}.hero h1 .g{color:var(--green)}
.counter{font-family:var(--display);font-weight:900;font-size:clamp(56px,11vw,104px);line-height:.9;color:var(--green)}
.sunrise{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--green) 0 34%,var(--sky) 34% 52%,var(--red) 52% 70%,var(--green) 70%)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.step{border-top:3px solid var(--green);padding-top:10px}
.step:nth-child(2){border-color:var(--sky)}.step:nth-child(3){border-color:var(--red)}
.leaders{display:flex;gap:14px;flex-wrap:wrap}
.leader{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 10px 10px;min-width:0}

/* Map */
.mapbox{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.tile{aspect-ratio:1;border:0;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;line-height:1;padding:2px;transition:transform .15s;max-width:100%}
.tile b{font-size:clamp(13px,2.2vw,19px)}
.tile span{font-family:var(--body);font-size:clamp(9px,1.4vw,12px);font-weight:700;opacity:.9;font-variant-numeric:tabular-nums}
.tile:hover{transform:scale(1.06)}
.tile.sel{outline:3px solid var(--red);outline-offset:1px}
.tile.pulse{animation:pulse 1s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--red) 70%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.tile,.tile.pulse{animation:none;transition:none}}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.legend i{width:80px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--tile0),var(--green))}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:8px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:3px;max-height:360px;overflow:auto;padding-right:4px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:13px;border:0;background:none;text-align:left;padding:4px 6px;border-radius:6px;cursor:pointer}
.bar:hover{background:var(--soft)}
.bar .t{position:relative;z-index:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:3px 6px}
.bar .t i{position:absolute;inset:0 auto 0 0;background:color-mix(in oklab,var(--green) 22%,transparent);border-radius:4px;z-index:-1}
.bar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:6px;font-size:14px}
.feed div{display:flex;gap:8px;align-items:baseline}
.feed time{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}

/* Card */
.cardwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
#cardImg{width:100%;max-width:520px;border-radius:12px;box-shadow:0 12px 40px -18px rgba(0,0,0,.35);display:block;aspect-ratio:1;background:var(--soft)}

/* Lists */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.person{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0}
.person>div{min-width:0}
.person .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .btn{margin-left:auto;flex:none}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

/* Chat */
.chat{display:flex;flex-direction:column;height:min(560px,70vh);border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:85%}
.msg .bub{background:var(--soft);padding:8px 12px;border-radius:12px 12px 12px 4px;min-width:0;overflow-wrap:anywhere}
.msg .who{font-size:12px;font-weight:700;color:var(--muted)}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg.mine .bub{background:color-mix(in oklab,var(--green) 20%,var(--card));border-radius:12px 12px 4px 12px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0}
.outing{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);flex-wrap:wrap}
.outing .date{font-family:var(--display);font-weight:800;text-align:center;min-width:52px;line-height:1}
.outing .date b{display:block;font-size:30px;color:var(--red)}

details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;justify-content:space-between}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .chev{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:800;transition:transform .2s}
details.fold[open]>summary .chev{transform:rotate(180deg)}
details.fold>summary:hover .chev{background:color-mix(in oklab,var(--green) 18%,var(--soft))}
details.fold[open]>summary{margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

@media (max-width:760px){
  .hero,.mapbox,.cardwrap{grid-template-columns:1fr}
  .hero{padding-top:12px}
  .tiles{gap:3px}.tile{border-radius:5px}
  h2{font-size:26px}
  .brand small{display:none}
  .brand{font-size:18px}
  .logo-plate img{height:32px}
}
</style>

</head>
<body>
<div id="demoBar" class="demo-bar" hidden>DEMO PREVIEW · sample members, nothing is saved · the live version runs on your own database</div>
<header class="top">
  <div class="wrap">
    <div class="logo-plate"><img src="logo.png" alt="YP4T logo"></div>
    <div class="brand">YP4T Connect<small>Young Professionals for Tinubu</small></div>
    <div class="me" id="meBox"></div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist" hidden></nav></div>
</header>
<main class="wrap" id="view"></main>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="lgas.js"></script>
<script>
"use strict";
/* ═════════════════════════ Static data ═════════════════════════ */
const STATES = Object.keys(window.NG_LGAS).sort();
// Tile map of Nigeria: [code, column, row]
const TILES = {
  "Sokoto":["SO",1,0],"Zamfara":["ZA",2,0],"Katsina":["KT",3,0],"Kano":["KN",4,0],"Jigawa":["JI",5,0],"Yobe":["YO",6,0],"Borno":["BO",7,0],
  "Kebbi":["KE",1,1],"Niger":["NI",2,1],"Kaduna":["KD",3,1],"Bauchi":["BA",4,1],"Gombe":["GO",5,1],"Adamawa":["AD",6,1],
  "Oyo":["OY",0,2],"Kwara":["KW",1,2],"FCT":["FC",2,2],"Nasarawa":["NA",3,2],"Plateau":["PL",4,2],"Taraba":["TA",5,2],
  "Ogun":["OG",0,3],"Osun":["OS",1,3],"Ekiti":["EK",2,3],"Kogi":["KO",3,3],"Benue":["BE",4,3],
  "Lagos":["LA",0,4],"Ondo":["ON",1,4],"Edo":["ED",2,4],"Enugu":["EN",3,4],"Ebonyi":["EB",4,4],"Cross River":["CR",5,4],
  "Delta":["DE",1,5],"Anambra":["AN",2,5],"Imo":["IM",3,5],"Abia":["AB",4,5],"Akwa Ibom":["AK",5,5],
  "Bayelsa":["BY",1,6],"Rivers":["RI",2,6]
};
const PROFESSIONS = ["Accountant","Architect","Banker","Civil Servant","Data Analyst","Doctor","Engineer","Entrepreneur","Journalist","Lawyer","Lecturer","Nurse","Pharmacist","Software Developer","Student","Surveyor","Teacher","Trader","Designer","Content Creator","Marketer","Farmer","Real Estate","Oil & Gas"];
const ROLE_LABEL = {member:"Member",ward:"Ward Coordinator",lga:"LGA Coordinator",state:"State Coordinator",national:"National Coordinator",secretary:"Admin / Secretary",admin:"Super Admin"};
const ADMIN_ROLES=["admin","national","secretary"];
const CFG = window.YP4T_CONFIG || {};
const LIVE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);

/* ═════════════════════════ Small helpers ═════════════════════════ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n||0).toLocaleString("en-NG");
const first = n => String(n||"").trim().split(/\s+/)[0] || "";
const shortName = n => { const p = String(n||"").trim().split(/\s+/); return p.length>1 ? `${p[0]} ${p[p.length-1][0]}.` : p[0]; };
const initials = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
const ago = t => { const s=(Date.now()-new Date(t))/1000; if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+"m ago"; if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; };
const avatar = (url, name, cls="") => url ? `<img class="avatar ${cls}" src="${esc(url)}" alt="">` : `<span class="avatar ${cls}">${esc(initials(name))}</span>`;
const isManager = m => m && m.status==="approved" && m.role!=="member";
const wardRoom = m => `ward:${m.state}|${m.lga}|${m.ward}`;
const dmRoom = (a,b) => "dm:" + [a,b].sort().join(":");
const ls = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }, del(k){ try{localStorage.removeItem(k)}catch(e){} } };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function titleCase(s){ return String(s||"").trim().replace(/\s+/g," ").replace(/\b\w/g,c=>c.toUpperCase()); }
function memberNo(m){ const code=(TILES[m.state]||["NG"])[0]; return `YP4T-${code}-${String(m.ref_code||"").toUpperCase().slice(0,6)}`; }
function inviteLink(m){ const u=new URL(location.href); u.search=""; u.hash=""; u.searchParams.set("ref", m.ref_code); return u.toString(); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("Copied"); }catch(e){ toast("Press and hold the link to copy it"); } }

/* ═════════════════════════ DEMO backend (sample data, in memory) ═════════════════════════ */
function makeDemo(){
  const FN=["Adebayo","Chiamaka","Musa","Aisha","Tunde","Ngozi","Ibrahim","Funke","Emeka","Zainab","Seun","Halima","Kelechi","Bola","Yusuf","Amaka","Femi","Hauwa","Chidi","Kemi","Sani","Ifeoma","Gbenga","Fatima","Obinna","Tolu","Abdullahi","Ada","Dayo","Maryam"];
  const LN=["Okafor","Bello","Adeyemi","Mohammed","Eze","Ogunleye","Abubakar","Nwosu","Lawal","Okonkwo","Yusuf","Balogun","Danjuma","Afolabi","Umar","Obi","Salami","Garba","Ibe","Akande"];
  const W={"Lagos":9,"Kaduna":7,"FCT":7,"Ekiti":6,"Nasarawa":5,"Oyo":4,"Kano":4,"Rivers":3,"Ogun":3,"Osun":2,"Ondo":2,"Kwara":2,"Plateau":2,"Niger":2,"Delta":2,"Edo":2,"Enugu":1.5,"Anambra":1.2,"Benue":1.3,"Katsina":1.5,"Bauchi":1.2};
  const pool=[]; STATES.forEach(s=>{ const w=W[s]||0.6; for(let i=0;i<w*10;i++) pool.push(s); });
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const now=Date.now();
  const mk=(i,ts)=>{ const st=pick(pool), lga=pick(window.NG_LGAS[st]); return {
    id:"demo-"+i, full_name:pick(FN)+" "+pick(LN), profession:pick(PROFESSIONS), state:st, lga, ward:"Ward "+(1+Math.floor(rnd()*8)),
    photo_url:null, has_pvc:rnd()<.78, canvass:rnd()<.34, listed:true, status:"approved", role:"member",
    ref_code:Math.floor(rnd()*1e9).toString(36).padStart(6,"0").slice(0,8), referred_by:null, created_at:new Date(ts).toISOString() }; };
  const db={ members:[], messages:[], outings:[], rsvps:[], projects:[], me:null, nextId:1 };
  for(let i=0;i<2480;i++) db.members.push(mk(i, now - rnd()*60*86400e3));
  db.members.forEach((m,i)=>{ if(i>40 && rnd()<.55) m.referred_by = db.members[Math.floor(rnd()*40)].id; });
  db.supporters=[]; { const SN=["Mama Ada Okeke","Baba Musa Danladi","Iya Bisi Alao","Mallam Sani Bello","Mama Ngozi Eze","Alhaji Garba Yusuf","Mrs Funmi Ojo","Mr Emeka Obi"]; for(let i=0;i<180;i++){ const a=db.members[Math.floor(rnd()*60)]; db.supporters.push({id:100000+i,added_by:a.id,full_name:pick(SN),phone:rnd()<.6?"080"+Math.floor(10000000+rnd()*89999999):null,state:a.state,lga:a.lga,ward:a.ward,polling_unit:rnd()<.5?"PU 00"+(1+Math.floor(rnd()*9)):null,has_pvc:rnd()<.85,consent:true,created_at:new Date(now-rnd()*20*86400e3).toISOString()}); } }

/* ═════════════════════════ LIVE backend (Supabase) ═════════════════════════ */
function makeLive(){
  let sb, uid=null; const roomCbs=new Map(); let liveCb=null;
  const must = ({data,error}) => { if(error) throw new Error(error.message); return data; };
  return {
    mode:"live",
    async init(){
      const loadJs = src => new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
      // Load the database library from our own site first (works on networks that block CDNs), then fall back to the CDNs
      let ok=false; for(const src of ["supabase.min.js","https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js","https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"]){ try{ await loadJs(src); if(window.supabase){ ok=true; break; } }catch(e){} }
      if(!ok) throw new Error("Could not connect. Check your internet connection, or try another network or Wi-Fi.");
      sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
      const {data} = await sb.auth.getSession(); uid = data.session?.user?.id || null;
      sb.auth.onAuthStateChange((_e, s)=>{ uid = s?.user?.id || null; });
      sb.channel("live-members").on("postgres_changes",{event:"*",schema:"public",table:"members"},()=>liveCb&&liveCb({type:"refresh"})).subscribe();
      sb.channel("live-messages").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{ (roomCbs.get(p.new.room)||[]).forEach(f=>f(p.new)); liveCb&&liveCb({type:"message",message:p.new}); }).subscribe();
    },
    async session(){ const {data}=await sb.auth.getSession(); uid=data.session?.user?.id||null; return data.session; },
    async sendCode(email){ must(await sb.auth.signInWithOtp({email, options:{shouldCreateUser:true, emailRedirectTo:location.origin+location.pathname}})); },
    async verifyCode(email, token){ const d=must(await sb.auth.verifyOtp({email, token, type:"email"})); uid=d.user?.id; },
    async sendPhoneCode(phone){ must(await sb.auth.signInWithOtp({phone, options:{shouldCreateUser:true, channel:"sms"}})); },
    async verifyPhone(phone, token){ const d=must(await sb.auth.verifyOtp({phone, token, type:"sms"})); uid=d.user?.id; },
    async google(){ must(await sb.auth.signInWithOAuth({provider:"google", options:{redirectTo:location.origin+location.pathname}})); },
    async signOut(){ await sb.auth.signOut(); uid=null; },
    async getMyProfile(){ if(!uid) return null; const m=must(await sb.from("members").select("*").eq("id",uid).maybeSingle()); if(!m) return null;
      const p=must(await sb.from("member_private").select("phone,email").eq("id",uid).maybeSingle()); return {...m, phone:p?.phone||"", email:p?.email||""}; },
    async saveProfile(p){ const row={id:uid,full_name:p.full_name,profession:p.profession,state:p.state,lga:p.lga,ward:p.ward,has_pvc:p.has_pvc,canvass:p.canvass,listed:p.listed};
      if(p.photo_url) row.photo_url=p.photo_url;
      const exists=must(await sb.from("members").select("id").eq("id",uid).maybeSingle());
      if(exists) must(await sb.from("members").update(row).eq("id",uid));
      else { row.invited_with = ls.get("yp4t-ref") || null; must(await sb.from("members").insert(row)); }
      must(await sb.from("member_private").upsert({id:uid, phone:p.phone, email:p.email}));
      return this.getMyProfile(); },
    async uploadPhoto(blob){ const path=`${uid}/${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}.jpg`;
      must(await sb.storage.from("photos").upload(path, blob, {contentType:"image/jpeg", upsert:false}));
      return sb.storage.from("photos").getPublicUrl(path).data.publicUrl; },
    async publicTotal(){ return must(await sb.rpc("public_total")); },
    async stats(){ return must(await sb.rpc("area_stats")) || []; },
    async recentJoins(){ return must(await sb.rpc("recent_joins")) || []; },
    onLive(cb){ liveCb=cb; },
    async topRecruiters(){ return must(await sb.rpc("top_recruiters")) || []; },
    async myTeam(){ return must(await sb.rpc("my_team")) || []; },
    async myRecruits(){ try{ return (await this.myTeam()).length; }catch(e){ const {count}=await sb.from("members").select("id",{count:"exact",head:true}).eq("referred_by",uid); return count||0; } },
    async allSupporters(){ let all=[], from=0; for(;;){ const r=must(await sb.from("supporters").select("*, members(full_name)").order("created_at",{ascending:false}).range(from,from+999)); all=all.concat(r||[]); if(!r||r.length<1000||all.length>=50000) break; from+=1000; } return all; },
    async publicSupporterTotal(){ try{ return must(await sb.rpc("public_supporter_total")); }catch(e){ return 0; } },
    async recruiterBoard(state){ return must(await sb.rpc("recruiter_board",{p_state:state||null})) || []; },
    async supporters(){ return must(await sb.from("supporters").select("*").eq("added_by",uid).order("created_at",{ascending:false}).limit(1000)) || []; },
    async addSupporter(p){ must(await sb.from("supporters").insert(p)); },
    async deleteSupporter(id){ must(await sb.from("supporters").delete().eq("id",id)); },
    async supporterStats(){ try{ return must(await sb.rpc("supporter_stats")) || []; }catch(e){ return []; } },
    async inviter(code){ const r=must(await sb.rpc("inviter_card",{p_code:code})); return (r&&r[0])||null; },
    async leaders(){ return must(await sb.rpc("public_leaders")) || []; },
    async areaCoordinators(state){ return must(await sb.rpc("area_coordinators",{p_state:state})) || []; },
    async directory({state,lga,q}){ let qy=sb.from("members").select("id,full_name,profession,state,lga,ward,photo_url,role").eq("status","approved").eq("listed",true).neq("id",uid).order("created_at",{ascending:false}).limit(60);
      if(state) qy=qy.eq("state",state); if(lga) qy=qy.eq("lga",lga);
      if(q){ const s=q.replace(/[%,()]/g," ").trim(); if(s) qy=qy.or(`full_name.ilike.%${s}%,profession.ilike.%${s}%,lga.ilike.%${s}%`); }
      return must(await qy) || []; },
    async messages(room){ return must(await sb.from("messages").select("*").eq("room",room).order("created_at",{ascending:true}).limit(200)) || []; },
    async send(room, body){ must(await sb.from("messages").insert({room, body})); },
    subscribeRoom(room, cb){ roomCbs.set(room,[cb]); return ()=>roomCbs.delete(room); },
    async dmPartners(){ return must(await sb.rpc("dm_partners")) || []; },
    async outings(m){ return must(await sb.from("outings").select("*, outing_rsvps(member_id)").eq("state",m.state).eq("lga",m.lga).ilike("ward",m.ward).gte("starts_at",new Date(Date.now()-86400e3).toISOString()).order("starts_at")) || []; },
    async createOuting(o){ must(await sb.from("outings").insert(o)); },
    async rsvp(id,on){ if(on) must(await sb.from("outing_rsvps").insert({outing_id:id})); else must(await sb.from("outing_rsvps").delete().eq("outing_id",id).eq("member_id",uid)); },
    async projects(state){ return must(await sb.from("projects").select("*").eq("state",state).order("created_at",{ascending:false})) || []; },
    async addProject(p){ must(await sb.from("projects").insert(p)); },
    async deleteProject(id){ must(await sb.from("projects").delete().eq("id",id)); },
    async pending(){ return must(await sb.from("members").select("*, member_private(phone,email)").eq("status","pending").order("created_at").limit(1000)) || []; },
    async setStatus(id,status){ must(await sb.from("members").update({status}).eq("id",id)); },
    async setRole(id,role){ must(await sb.from("members").update({role}).eq("id",id)); },
    async adminTeam(){ return must(await sb.rpc("admin_team")) || []; },
    async areaMembers(){ let all=[], from=0; for(;;){ const r=must(await sb.from("members").select("id,full_name,profession,state,lga,ward").eq("status","approved").order("created_at").range(from,from+999)); all=all.concat(r||[]); if(!r||r.length<1000||all.length>=20000) break; from+=1000; } return all; },
    async setArea(id,lga,ward){ must(await sb.from("members").update({lga,ward}).eq("id",id)); },
    async coordinators(){ return must(await sb.from("members").select("id,full_name,profession,role,state,lga,ward,photo_url").eq("status","approved").in("role",["state","lga","ward"]).order("state").limit(2000)) || []; },
    async adminFind(q){ return must(await sb.rpc("admin_find",{q})) || []; },
    async candidates(state){ return must(await sb.rpc("coordinator_candidates",{p_state:state})) || []; }
  };
}

async function boot(){
  $("#demoBar").hidden = LIVE;
  try{ await api.init(); }catch(e){ $("#view").innerHTML=`<div class="panel err">${esc(e.message)}</div>`; return; }
  api.onLive(onLive);
  await refreshAuth();
  setInterval(()=>{ if(S.me?.status==="approved") loadStats(); }, 30000);
}
async function refreshAuth(){
  S.session = await api.session();
  S.me = S.session ? await api.getMyProfile().catch(()=>null) : null;
  renderTop();
  if(!S.session) return renderLanding();
  if(!S.me) return renderJoin();
  if(S.me.status!=="approved"){ return renderPending(); }
  await loadStats();
  go(S.tab);
}
async function loadStats(){
  try{ S.stats = await api.stats(); S.total = S.stats.reduce((a,r)=>a+Number(r.members),0); }catch(e){ console.warn(e); }
  try{ S.sstats = await api.supporterStats(); }catch(e){ S.sstats=[]; }
  if(S.tab==="map" && S.me?.status==="approved") renderMapData();
}
function onLive(ev){
  if(ev.type==="join"){ // demo
    const m=ev.member; S.feed.unshift({first_name:first(m.full_name),profession:m.profession,state:m.state,lga:m.lga,created_at:m.created_at});
    const r=S.stats.find(x=>x.state===m.state&&x.lga===m.lga&&x.ward===m.ward); if(r){ r.members++; r.new_7d++; if(m.has_pvc) r.pvc++; if(m.canvass) r.canvass++; } else S.stats.push({state:m.state,lga:m.lga,ward:m.ward,members:1,pvc:m.has_pvc?1:0,canvass:m.canvass?1:0,new_7d:1});
    S.total++; if(S.tab==="map"&&S.me?.status==="approved"){ renderMapData(m.state); } if(!S.me) updateLandingCount();
  } else if(ev.type==="refresh"){ clearTimeout(onLive._t); onLive._t=setTimeout(async()=>{ if(S.me?.status==="approved"){ const before=S.total; await loadStats(); try{ S.feed=await api.recentJoins(); }catch(e){} if(S.tab==="map") renderFeed(); if(S.total>before) pulseTotal(); } else if(!S.me) updateLandingCount(); }, 800); }
}

/* ═════════════════════════ Header + tabs ═════════════════════════ */
function renderTop(){
  const m=S.me, box=$("#meBox"), tabs=$("#tabs");
  if(S.session){ box.innerHTML = `${m?avatar(m.photo_url,m.full_name):""}<button class="btn ghost sm" id="outBtn">Sign out</button>`; $("#outBtn").onclick=async()=>{ await api.signOut(); S.me=null; S.tab="map"; refreshAuth(); }; }
  else { box.innerHTML = `<button class="btn ghost sm" id="topSignIn">Sign in</button><button class="btn sm" id="topJoin">Join</button>`;
    $("#topJoin").onclick=()=>{ if(!$("#authBox")) renderLanding(); renderAuthBox("email","","join"); $("#authBox")?.scrollIntoView({behavior:"smooth",block:"center"}); $("#email")?.focus(); };
    $("#topSignIn").onclick=()=>{ if(!$("#authBox")) renderLanding(); renderAuthBox("email","","signin"); $("#authBox")?.scrollIntoView({behavior:"smooth",block:"center"}); $("#email")?.focus(); }; }
  const show = m && m.status==="approved";
  tabs.hidden = !show;
  if(show){ tabs.innerHTML = TABS.filter(([k])=>k!=="admin"||isManager(m)).map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("");
    tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.tab)); }
}
function go(tab){
  if(S.unsub){ S.unsub(); S.unsub=null; }
  S.tab=tab; renderTop(); window.scrollTo(0,0);
  ({map:renderMap,card:renderCard,team:renderTeam,ward:renderWard,people:renderPeople,ranks:renderRanks,projects:renderProjects,admin:renderAdmin}[tab]||renderMap)();
}

function ngPhone(v){ let d=String(v||"").replace(/\D/g,""); if(d.startsWith("234")) d=d.slice(3); if(d.startsWith("0")) d=d.slice(1); return /^[789][01]\d{8}$/.test(d) ? "+234"+d : null; }
function prettyPhone(p){ const d=String(p||"").replace(/\D/g,""); return d.startsWith("234") ? "0"+d.slice(3) : p; }
// Ward check: catches slogans, codes and names typed into the Ward box
function wardProblem(ward, name){
  const w=String(ward||"").trim(), lw=w.toLowerCase();
  if(w.length<2) return "Type the name of your ward.";
  if(/tinubu|voting|vote|president|renewed|hope|2027|yp4t|apc|bat\b/.test(lw)) return "That looks like a slogan, not a ward. Type the ward name from your PVC, e.g. \"Karu Ward\".";
  if(/[@]|https?:|www\./.test(lw)) return "Type the ward name only, not an email or link.";
  if(/\d{5,}/.test(w) || /^[0-9a-f]{8,}$/i.test(w.replace(/\s/g,""))) return "That looks like a code or number. Type the ward name from your PVC, e.g. \"Ward 04\" or \"Ikate\".";
  if(w.length>60) return "That's too long for a ward name.";
  const nm=String(name||"").toLowerCase().split(/\s+/).filter(x=>x.length>2);
  const wt=lw.replace(/\bward\b/g,"").split(/\s+/).filter(Boolean);
  if(nm.length && wt.length && wt.every(t=>nm.includes(t))) return "That looks like a person's name. Type the ward name from the PVC, e.g. \"Karu Ward\".";
  return null;
}

async function squarePhoto(file, size){
  const url=URL.createObjectURL(file); const img=new Image(); img.src=url; await img.decode();
  const s=Math.min(img.naturalWidth,img.naturalHeight); const c=document.createElement("canvas"); c.width=c.height=size;
  c.getContext("2d").drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/3,s,s,0,0,size,size); URL.revokeObjectURL(url);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",.86));
}

function renderMapData(flash){
  const tiles=$("#tiles"); if(!tiles) return;
  const byState=agg(S.stats, r=>r.state); const max=Math.max(1,...[...byState.values()].map(a=>a.members));

let LOGO_IMG=null;
async function loadLogo(){ if(LOGO_IMG) return LOGO_IMG; const i=new Image(); i.src="logo.png"; await i.decode(); return LOGO_IMG=i; }
async function drawCard(m){
  await Promise.all([document.fonts.load('900 80px "Big Shoulders Display"'),document.fonts.load('800 40px "Figtree"'),document.fonts.load('600 30px "IBM Plex Mono"')]).catch(()=>{});
  const W=1080, c=document.createElement("canvas"); c.width=c.height=W; const x=c.getContext("2d");
  const G="#2E9B53", R="#DF3F3B", B="#45B5DF", N="#1B2140";
  x.fillStyle="#FFFFFF"; x.fillRect(0,0,W,W);
  // sunrise rays echoing the logo
  x.save(); x.translate(W/2, W+120); const cols=[G,B,R,G,B,G,R,B,G];
  for(let i=0;i<9;i++){ const a0=Math.PI+i*(Math.PI/9)+0.02, a1=a0+Math.PI/9-0.04; x.beginPath(); x.arc(0,0,1500,a0,a1); x.arc(0,0,1160,a1,a0,true); x.closePath(); x.fillStyle=cols[i]; x.globalAlpha=.13; x.fill(); }
  x.restore(); x.globalAlpha=1;
  // top band
  x.fillStyle=G; x.fillRect(0,0,W,16); x.fillStyle=B; x.fillRect(W*.34,0,W*.18,16); x.fillStyle=R; x.fillRect(W*.52,0,W*.18,16);
  const logo=await loadLogo(); const lw=300, lh=lw*logo.naturalHeight/logo.naturalWidth; x.drawImage(logo,64,52,lw,lh);
  x.textAlign="right"; x.fillStyle=N; x.font='600 26px "IBM Plex Mono", monospace'; x.fillText("MEMBERSHIP CARD",W-64,92);
  x.fillStyle=R; x.font='600 26px "IBM Plex Mono", monospace'; x.fillText(memberNo(m),W-64,130);
  x.fillStyle=G; x.font='900 64px "Big Shoulders Display", Impact, sans-serif'; x.fillText("PROUD MEMBER",W-64,212);
  // photo
  const px=W/2, py=500, pr=150;
  x.beginPath(); x.arc(px,py,pr+12,0,Math.PI*2); x.fillStyle=G; x.fill();
  x.beginPath(); x.arc(px,py,pr+4,0,Math.PI*2); x.fillStyle="#fff"; x.fill();
  x.save(); x.beginPath(); x.arc(px,py,pr,0,Math.PI*2); x.clip();
  if(m.photo_url){ try{ const im=new Image(); im.crossOrigin="anonymous"; im.src=m.photo_url; await im.decode(); x.drawImage(im,px-pr,py-pr,pr*2,pr*2); }catch(e){ x.fillStyle="#E4EAE0"; x.fillRect(px-pr,py-pr,pr*2,pr*2); } }
  else { x.fillStyle="#E4EAE0"; x.fillRect(px-pr,py-pr,pr*2,pr*2); x.fillStyle="#8A93A6"; x.textAlign="center"; x.font='900 120px "Big Shoulders Display", Impact'; x.fillText(initials(m.full_name),px,py+42); }
  x.restore();
  // name + profession
  x.textAlign="center"; x.fillStyle=N; let fs=86; const name=m.full_name.toUpperCase();
  do{ x.font=`900 ${fs}px "Big Shoulders Display", Impact, sans-serif`; fs-=4; } while(x.measureText(name).width>W-140 && fs>40);
  x.fillText(name,W/2,740);
  x.fillStyle=G; x.font='800 40px "Figtree", sans-serif'; x.fillText(m.profession.toUpperCase(),W/2,796);
  x.fillStyle="#5B6377"; x.font='600 30px "Figtree", sans-serif'; x.fillText(`${m.lga}, ${m.state === "FCT" ? "Abuja (FCT)" : m.state+" State"}`,W/2,842);
  // vote banner
  const by=890, bh=126; x.fillStyle=R; roundRect(x,64,by,W-128,bh,18); x.fill();
  x.fillStyle="#fff"; const vote="I'M VOTING PRESIDENT TINUBU 2027"; let vf=64;
  do{ x.font=`900 ${vf}px "Big Shoulders Display", Impact, sans-serif`; vf-=2; } while(x.measureText(vote).width>W-190 && vf>28);
  x.fillText(vote,W/2,by+bh/2+vf*0.36);
  x.fillStyle=N; x.font='600 24px "IBM Plex Mono", monospace'; x.fillText("YOUNG PROFESSIONALS FOR TINUBU · RENEWED HOPE",W/2,1052);
  return c;
}
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }

async function openChat(box, room, emptyText){

    let cur=[];
    const draw=()=>{ const st=os.value, q=$("#oFind").value.trim().toLowerCase();
      cur=ALL.filter(x=>(!st||x.state===st)&&(!q||(x.full_name+" "+x.ward+" "+x.lga+" "+(x.members?.full_name||"")).toLowerCase().includes(q)));
      const wk=Date.now()-7*86400e3;
      $("#oTotals").innerHTML=`<div class="stat"><b>${fmt(cur.length)}</b><span class="small muted">offline supporters</span></div><div class="stat"><b>${fmt(cur.filter(x=>x.has_pvc).length)}</b><span class="small muted">have PVCs</span></div><div class="stat"><b>+${fmt(cur.filter(x=>new Date(x.created_at)>wk).length)}</b><span class="small muted">this week</span></div>`;
      box.innerHTML = cur.length ? `<table><thead><tr><th>Name</th><th>Phone</th><th>Area</th><th>Polling unit</th><th>PVC</th><th>Added by</th><th>Added</th></tr></thead><tbody>${cur.slice(0,500).map(x=>`<tr><td><b>${esc(x.full_name)}</b></td><td class="small num">${esc(x.phone?prettyPhone(x.phone):"")}</td><td class="small">${esc(x.ward)}, ${esc(x.lga)}, <b>${esc(x.state)}</b></td><td class="small">${esc(x.polling_unit||"")}</td><td>${x.has_pvc?'<span class="pill g">Yes</span>':'<span class="pill w">No</span>'}</td><td class="small">${esc(x.members?.full_name||"")}</td><td class="small muted">${ago(x.created_at)}</td></tr>`).join("")}</tbody></table>${cur.length>500?`<p class="small muted">Showing the newest 500. Download the CSV for the full list.</p>`:""}`
        : `<div class="empty">No offline supporters${st?" in "+esc(st):""} yet.</div>`; };
    os.onchange=draw; let t; $("#oFind").oninput=()=>{ clearTimeout(t); t=setTimeout(draw,250); };
    $("#oCsv").onclick=()=>{ const cell=v=>`"${String(v??"").replace(/"/g,'""')}"`; const rows=[["Name","Phone","State","LGA","Ward","Polling unit","Has PVC","Added by","Added on"]].concat(cur.map(x=>[x.full_name,x.phone?prettyPhone(x.phone):"",x.state,x.lga,x.ward,x.polling_unit||"",x.has_pvc?"Yes":"No",x.members?.full_name||"",new Date(x.created_at).toLocaleString("en-NG")]));
      const blob=new Blob(["\ufeff"+rows.map(r=>r.map(cell).join(",")).join("\r\n")],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`YP4T-offline-supporters-${os.value||"all-states"}.csv`; document.body.appendChild(a); a.click(); a.remove(); };
    const sm=$("#oSummary"); if(sm) sm.innerHTML=`<b>${fmt(ALL.length)}</b> supporters · <b>${fmt(ALL.filter(x=>x.has_pvc).length)}</b> with PVC · ${Object.keys(byS).length} states. ${$("#foldOff")?.open?"Tap to close.":"Tap to open the full list."}`;
    $("#foldOff")?.addEventListener("toggle",e=>{ S.foldOff=e.target.open; if(sm) sm.innerHTML=sm.innerHTML.replace(/Tap to (open the full list|close)\./, e.target.open?"Tap to close.":"Tap to open the full list."); });
    draw(); }).catch(e=>{ const box=$("#oList"); if(box) box.innerHTML=`<div class="err">${esc(e.message)}</div>`; });
  const loadFix=()=>api.areaMembers().then(M=>{ const box=$("#fixList"); if(!box) return; const B=M.filter(x=>wardProblem(x.ward,x.full_name)); $("#fixN").textContent=`${B.length} to fix`;
    box.innerHTML = B.length ? `<table><thead><tr><th>Member</th><th>State</th><th>LGA</th><th>Ward</th><th></th></tr></thead><tbody>${B.slice(0,300).map(x=>`<tr data-row="${x.id}"><td><b>${esc(x.full_name)}</b><div class="small muted">Was: "${esc(x.ward)}"</div></td><td class="small">${esc(x.state)}</td><td><select data-lga aria-label="LGA for ${esc(x.full_name)}" style="min-width:150px">${lgaOptions(x.state,x.lga)}</select></td><td><input type="text" data-ward maxlength="60" placeholder="Correct ward" aria-label="Ward for ${esc(x.full_name)}" style="min-width:160px"></td><td><button class="btn sm" data-save="${x.id}">Save</button></td></tr>`).join("")}</tbody></table>${B.length>300?`<p class="small muted">Showing the first 300.</p>`:""}`
      : `<div class="empty">All wards look fine.</div>`;
    box.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{ const tr=b.closest("tr"), x=B.find(y=>y.id===b.dataset.save); const lga=tr.querySelector("[data-lga]").value, ward=titleCase(tr.querySelector("[data-ward]").value);
      if(!lga){ toast("Choose the LGA"); return; } const wp=wardProblem(ward,x.full_name); if(wp){ toast(wp); return; }
      b.disabled=true; try{ await api.setArea(x.id,lga,ward); toast("Ward fixed"); loadFix(); loadStats(); }catch(e){ toast(e.message); b.disabled=false; } }); }).catch(e=>{ const box=$("#fixList"); if(box) box.innerHTML=`<div class="err">${esc(e.message)}</div>`; });
  loadFix();
  api.coordinators().then(C=>{ const box=$("#coordList"); if(!box) return; $("#coordN").textContent=`${C.length} appointed`;
    const order={state:0,lga:1,ward:2}; const by={}; C.forEach(c=>(by[c.state]=by[c.state]||[]).push(c));
    box.innerHTML = C.length ? Object.keys(by).sort().map(st=>`<div><div class="eyebrow" style="margin-bottom:6px">${esc(st)} · ${by[st].length}</div><div class="people" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${by[st].sort((a,b)=>order[a.role]-order[b.role]||a.lga.localeCompare(b.lga)).map(c=>`<div class="person">${avatar(c.photo_url,c.full_name)}<div><div class="nm">${esc(c.full_name)}</div><div class="sub">${ROLE_LABEL[c.role]}${c.role!=="state"?" · "+esc(c.role==="ward"?(c.ward+", "+c.lga):c.lga):""}</div></div>${c.id!==me.id?`<button class="btn sm ghost" data-dm="${c.id}" data-n="${esc(c.full_name)}">Message</button>`:""}</div>`).join("")}</div></div>`).join("")
      : `<div class="empty">No State, LGA or Ward Coordinators yet. Appoint them below.</div>`;
    box.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>openDm(b.dataset.dm,b.dataset.n)); }).catch(e=>{ const box=$("#coordList"); if(box) box.innerHTML=`<div class="err">${esc(e.message)}</div>`; });
  if(canStates) $("#aState").onchange=e=>{ S.adminState=e.target.value; renderAdmin(); };
  try{ const ALL=await api.pending();
    const byS=ALL.reduce((a,p)=>(a[p.state]=(a[p.state]||0)+1,a),{});
    const ps=$("#pState"); ps.innerHTML=`<option value="">All states (${ALL.length})</option>`+Object.keys(byS).sort().map(k=>`<option value="${esc(k)}" ${S.pendState===k?"selected":""}>${esc(k)} (${byS[k]})</option>`).join("");
    if(S.pendState && !byS[S.pendState]) S.pendState="";
    ps.value=S.pendState||""; ps.onchange=()=>{ S.pendState=ps.value; renderAdmin(); };
    const P=ALL.filter(p=>!S.pendState||p.state===S.pendState);
    $("#pendN").textContent=`${P.length} waiting`;
    $("#pend").innerHTML = P.length? `<div class="row" style="margin-bottom:8px"><button class="btn sm" id="okAll">Approve all ${P.length} shown</button><span class="small muted">Check names first. Anyone suspicious, reject them one by one.</span></div><div class="scroll"><table><thead><tr><th>Name</th><th>Profession</th><th>Area</th><th>Phone</th><th>Joined</th><th></th></tr></thead><tbody>${P.map(p=>`<tr><td><b>${esc(p.full_name)}</b></td><td>${esc(p.profession)}</td><td class="small">${esc(p.ward)}, ${esc(p.lga)}, <b>${esc(p.state)}</b></td><td class="small num">${esc(p.member_private?.phone||"")}</td><td class="small muted">${ago(p.created_at)}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-ok="${p.id}">Approve</button><button class="btn ghost sm" data-no="${p.id}">Reject</button></div></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Nobody is waiting. New sign-ups without an invite will appear here.</div>`;
    $("#pend").querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{ await api.setStatus(b.dataset.ok,"approved"); toast("Approved"); renderAdmin(); });
    $("#pend").querySelectorAll("[data-no]").forEach(b=>b.onclick=async()=>{ await api.setStatus(b.dataset.no,"rejected"); toast("Rejected"); renderAdmin(); });
    $("#okAll")?.addEventListener("click",async e=>{ const b=e.currentTarget; if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent=`Tap again to approve ${P.length}`; return; } b.disabled=true; let n=0; for(const p of P){ try{ await api.setStatus(p.id,"approved"); n++; b.textContent=`Approving… ${n}/${P.length}`; }catch(err){} } toast(`Approved ${n}`); renderAdmin(); }); }catch(e){ $("#pend").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
  const roles = isSuper ? ["member","ward","lga","state","national","secretary"] : canStates ? ["member","ward","lga","state"] : ["member","ward","lga"];
  const drawCands = C => {
    $("#cands").innerHTML = C.length? `<table><thead><tr><th>Member</th><th>Area</th><th class="n">Recruits</th><th class="n">Outings</th><th>Door-to-door</th><th>Role</th></tr></thead><tbody>${C.map(c=>`<tr><td><b>${esc(c.full_name)}</b><div class="small muted">${esc(c.profession||"")}</div></td><td class="small">${esc(c.ward)}, ${esc(c.lga)}${c.state&&c.state!==st?", "+esc(c.state):""}</td><td class="n">${fmt(c.recruits)}</td><td class="n">${fmt(c.outings)}</td><td>${c.canvass?'<span class="pill g">Yes</span>':'<span class="small muted">No</span>'}</td><td><select data-role="${c.id}" aria-label="Role for ${esc(c.full_name)}" ${(c.role==="admin"||(!isSuper&&ADMIN_ROLES.includes(c.role)))?"disabled":""}>${((c.role==="admin"||(!isSuper&&ADMIN_ROLES.includes(c.role)))?[c.role]:roles).map(r=>`<option value="${r}" ${r===c.role?"selected":""}>${ROLE_LABEL[r]}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table>` : `<div class="empty">No approved members in this state yet.</div>`;
    $("#cands").querySelectorAll("[data-role]").forEach(s=>s.onchange=async()=>{ try{ await api.setRole(s.dataset.role,s.value); toast(`Now ${ROLE_LABEL[s.value]}`); if(ADMIN_ROLES.includes(s.value)||canStates) renderAdmin(); }catch(err){ toast(err.message); } }); };
  try{ drawCands(await api.candidates(st||null)); }catch(e){ $("#cands").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
  let ft; $("#aFind")?.addEventListener("input",e=>{ clearTimeout(ft); const q=e.target.value.trim(); ft=setTimeout(async()=>{ try{ drawCands(q.length>=2 ? await api.adminFind(q) : await api.candidates(st||null)); }catch(err){ $("#cands").innerHTML=`<div class="err">${esc(err.message)}</div>`; } },350); });
}

boot();
</script>

</body>
</html>
